; Copy iphlpapi.dll and this file next to ffxivboot.exe.
[Redirect]
; Your server's address (IP or name). Leave empty to turn redirecting off.
server=127.0.0.1
; Names to send to your server. These are the ones the game uses.
hosts=ver01.ffxiv.com,account.square-enix.com,lobby01.ffxiv.com,track01.ffxiv.com
; 1 writes iphlpapi.log next to the DLL, listing each redirect.
log=0

[Boot]
; Your patch certificate (patch_cert.der from Tools/PatchTool keygen), so ffxivboot accepts your patches.
; A full path, or one relative to this folder. Empty: boot keeps its own certificate.
cert=
