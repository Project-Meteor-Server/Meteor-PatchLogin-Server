; Copy iphlpapi.dll and this file next to ffxivboot.exe.
[Redirect]
; Your server's address (IP or name). Leave empty to turn redirecting off.
server=127.0.0.1
; Names to send to your server. These are the ones the game uses.
hosts=ver01.ffxiv.com,account.square-enix.com,lobby01.ffxiv.com,track01.ffxiv.com
; 1 writes iphlpapi.log next to the DLL, listing each redirect.
log=0

[Boot]
; The certificate ffxivboot checks your patches against. Empty: downloaded from the server
; (http://<server>:<patch_port>/patch/cert) and kept here as patch_cert.der. Or a file (a full path,
; or one relative to this folder), or off to leave boot its own certificate.
cert=
; The server's patch port (the version check), which serves the certificate.
patch_port=54996
